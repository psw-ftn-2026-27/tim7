<div class="stack">
  <p><a class="back" routerLink="/games">Back to quizzes</a></p>

  <div class="page-header">
    <div>
      <span class="badge badge--games">Games</span>
      <h1>New quiz</h1>
      <p>A new quiz starts as a draft; you add its questions on the next page.</p>
    </div>
  </div>

  <form class="card stack" (submit)="submit($event)">
    <div class="field">
      <label for="name">Name</label>
      <input id="name" type="text" [formField]="form.name" />
    </div>

    <div class="field">
      <label for="instructions">Instructions (optional)</label>
      <textarea id="instructions" rows="4" [formField]="form.instructions"></textarea>
    </div>

    <div class="field">
      <label for="xp">XP (optional)</label>
      <input id="xp" type="number" [formField]="form.xp" />
    </div>

    @if (error()) {
      <p class="alert">{{ error() }}</p>
    }

    <button class="button button--primary" type="submit" [disabled]="pending()">Save</button>
  </form>
</div>
