<div class="card stack">
  <h1>Create club</h1>

  <form class="stack" (submit)="submit($event)">
    <div class="field">
      <label for="name">Name</label>
      <input id="name" type="text" [formField]="form.name" />
      @if (form.name().touched()) {
        @for (message of form.name().errors(); track $index) {
          <p class="error">{{ message.message }}</p>
        }
      }
    </div>

    <div class="field">
      <label for="description">Description</label>
      <textarea id="description" rows="6" [formField]="form.description"></textarea>
      @if (form.description().touched()) {
        @for (message of form.description().errors(); track $index) {
          <p class="error">{{ message.message }}</p>
        }
      }
    </div>

    <div class="field">
      <label for="images">Image addresses, one per line</label>
      <textarea id="images" rows="4" [formField]="form.images"></textarea>
    </div>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <div class="actions">
      <button class="button button--primary" type="submit" [disabled]="!form().valid() || pending()">
        Create
      </button>
      <a class="button" routerLink="/social/clubs/mine">Cancel</a>
    </div>
  </form>
</div>
