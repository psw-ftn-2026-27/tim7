<article class="card stack">
  <h3>{{ club().name }}</h3>

  @if (club().status === 'Closed') {
    <p class="meta">Closed</p>
  }

  <p>{{ club().description }}</p>

  @if (club().images.length > 0) {
    <div class="thumbnails">
      @for (image of club().images; track $index) {
        <img [src]="image" [alt]="club().name" />
      }
    </div>
  }

  <a [routerLink]="['/social/clubs', club().id]">Open club</a>
</article>
