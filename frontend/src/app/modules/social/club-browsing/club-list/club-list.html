<div class="stack">
  <span class="badge badge--social">Social</span>
  <h1>Clubs</h1>

  <nav class="subnav" aria-label="Social pages">
    <a routerLink="/social">All blogs</a>
    <a routerLink="/social/clubs/mine">My clubs</a>
    <a routerLink="/social/clubs/create">Create club</a>
  </nav>

  @if (clubs.isLoading()) {
    <p class="meta">Loading clubs...</p>
  } @else if (clubs.error()) {
    <p class="alert">Could not load clubs. Log in and try again.</p>
  } @else {
    <div class="grid">
      @for (club of clubs.value()?.items ?? []; track club.id) {
        <app-club-card [club]="club" />
      } @empty {
        <p class="empty">No clubs yet.</p>
      }
    </div>
  }

  <p class="pages">
    <button class="button" type="button" [disabled]="page() === 1" (click)="previousPage()">
      Previous
    </button>
    <button class="button" type="button" [disabled]="!hasNextPage()" (click)="nextPage()">
      Next
    </button>
  </p>
</div>
