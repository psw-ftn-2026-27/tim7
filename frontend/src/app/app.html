@if (showHeader()) {
  <header>
    <nav class="container">
      <a class="brand" routerLink="/">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z" />
          <circle cx="12" cy="9.5" r="2.5" />
        </svg>
        Explorer
      </a>
      @if (auth.isLoggedIn()) {
        <a routerLink="/exploration">Exploration</a>
        <a routerLink="/games">Games</a>
        <a routerLink="/social">Social</a>
        <a routerLink="/payment">Payment</a>
        <a routerLink="/identity/users">Users</a>
      }

      <span class="nav-user">
        @if (auth.user(); as user) {
          <span>{{ user.email }}</span>
          <button class="button" type="button" (click)="auth.logout()">Logout</button>
        } @else {
          <a routerLink="/login">Login</a>
          <a routerLink="/register">Register</a>
        }
      </span>
    </nav>
  </header>
}

<main class="container stack">
  <router-outlet (activate)="onPageShown($event)" />
</main>
